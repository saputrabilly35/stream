<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BRB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08080a;
    --panel:#131316;
    --silver-bright:#f1f3f4;
    --silver:#b9bec3;
    --silver-dim:#6c7175;
    --hairline:rgba(185,190,195,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;background:var(--void);overflow:hidden;font-family:'Inter',sans-serif;}

  .backdrop{
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 4px),
      radial-gradient(circle at 50% 45%, #17181b 0%, #08080a 70%);
  }
  .grid-lines{
    position:absolute;inset:0;
    background-image:linear-gradient(var(--hairline) 1px, transparent 1px),linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size:96px 96px;opacity:.05;
  }

  .stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

  .frame-outer{
    position:relative;width:1020px;padding:3px;
    background:linear-gradient(155deg, var(--silver-bright), var(--silver-dim) 40%, var(--silver) 100%);
    clip-path:polygon(40px 0,100% 0,100% calc(100% - 40px),calc(100% - 40px) 100%,0 100%,0 40px);
  }
  .frame-inner{
    background:var(--panel);
    clip-path:polygon(38px 0,100% 0,100% calc(100% - 38px),calc(100% - 38px) 100%,0 100%,0 38px);
    padding:80px 90px 74px;text-align:center;position:relative;
  }

  .tick{position:absolute;width:26px;height:26px;border:2px solid var(--silver-bright);opacity:.85;}
  .tick.tl{top:-14px;left:-14px;border-right:none;border-bottom:none;}
  .tick.tr{top:-14px;right:-14px;border-left:none;border-bottom:none;}
  .tick.bl{bottom:-14px;left:-14px;border-right:none;border-top:none;}
  .tick.br{bottom:-14px;right:-14px;border-left:none;border-top:none;}

  .eyebrow{
    font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.6em;
    font-size:22px;color:var(--silver-dim);margin-bottom:26px;
  }

  .rings{
    width:74px;height:74px;margin:0 auto 34px;
    border-radius:50%;
    border:3px solid var(--hairline);
    border-top-color:var(--silver-bright);
    animation:spin 1.4s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .message{
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:52px;letter-spacing:.02em;color:var(--silver-bright);
    text-transform:uppercase;line-height:1.3;
  }

  .hairline-row{margin-top:48px;display:flex;align-items:center;justify-content:center;gap:24px;}
  .hairline-row .line{height:1px;width:180px;background:linear-gradient(90deg, transparent, var(--hairline), transparent);}
  .hairline-row .socials{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:600;letter-spacing:.15em;color:var(--silver-dim);}
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="grid-lines"></div>

  <div class="stage">
    <div class="frame-outer">
      <div class="frame-inner">
        <div class="tick tl"></div>
        <div class="tick tr"></div>
        <div class="tick bl"></div>
        <div class="tick br"></div>

        <div class="eyebrow">BE RIGHT BACK</div>
        <div class="rings"></div>
        <div class="message">I will be right back<br>guys, hang tight!</div>

        <div class="hairline-row">
          <div class="line"></div>
          <div class="socials">@billyftw_</div>
          <div class="line"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
